# Optional participant evaluation configuration for Stage 1 inference.
# Controls per-task execution budgets and sandbox command timeouts.
#
# dipin-step-budget-v1: the only change from baseline is the per-task budget.
# 12 h for ~120 tasks = 6 min/task including sandbox setup and a one-off vLLM start,
# so the agent gets ~4.5 min (was 1 min) and 50 tool calls (was 10). Command timeout and turns unchanged.
evaluation:
  timeout_seconds: 60
  max_tool_calls: 50
  max_time_minutes: 4.5
  max_turns: 50
